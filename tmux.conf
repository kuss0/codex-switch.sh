# SSH-like terminal behavior from kuss0/codex-switch.sh, with a window status bar.
set -g status on
set -g default-terminal 'tmux-256color'
if-shell -F '#{>=:#{version},3.2}' {
    # Reset this option before appending so reloads do not accumulate entries.
    set -su terminal-features
    set -as terminal-features ',xterm*:RGB'
    set -s extended-keys on
}
set -s escape-time 20
set -g focus-events on
set -g mouse on
set -s set-clipboard on
set -g history-limit 100000
set -g window-size latest
set -g destroy-unattached off
set -s exit-unattached off
unbind-key -a
bind-key -n F12 detach-client
bind-key d detach-client
bind-key '[' copy-mode
bind-key b send-prefix
bind-key C-b send-prefix
bind-key -T copy-mode Escape send-keys -X cancel
bind-key -T copy-mode q send-keys -X cancel
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# Window status and mouse selection.
set -g status-style 'bg=default,fg=default'
set -g status-left-length 24
set -g status-right ''
set -g status-left '#[fg=#{?client_prefix,#9e6a03,#ee82ee},bold] #S#{?#{==:#{pane_mode},copy-mode}, [复制],} #[default] '
set -g activity-action none
setw -g monitor-activity off
setw -g window-status-style default
setw -g window-status-current-style 'bg=#008000,fg=#ffffff,bold'
setw -g window-status-format ' #I #W '
setw -g window-status-current-format ' #I #W '
bind-key -T root MouseDown1Status select-window -t =
